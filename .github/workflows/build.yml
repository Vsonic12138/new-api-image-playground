name: Build React playground
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax-check smoke and standalone backend
        run: |
          node --check scripts/smoke-images.mjs
          node --check server/standalone.mjs
      - name: Check and build
        run: npm run build
      - name: Build production standalone bundle
        run: npm run build:standalone
      - name: Build embedded NewAPI UI bundle
        run: npm run build:embedded
      - name: Test standalone proxy against a fake upstream (no billable requests)
        run: node --test tests/standalone.test.mjs
