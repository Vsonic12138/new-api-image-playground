name: Build React playground
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax-check live API smoke script (no billable requests)
        run: node --check scripts/smoke-images.mjs
      - name: Check and build
        run: npm run build
